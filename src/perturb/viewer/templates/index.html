<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>perturb · viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
          colors: {
            ink: { 950: '#09090b', 900: '#0c0c0e', 850: '#101013', 800: '#16161a', 700: '#1f1f24', 600: '#2a2a31', 500: '#3a3a44' }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="bg-ink-950 text-zinc-100 font-sans antialiased h-screen overflow-hidden">
  <!-- Top bar -->
  <header class="h-12 flex items-center px-4 border-b border-ink-700 bg-ink-900/80 backdrop-blur-sm">
    <div class="flex items-center gap-2 font-semibold tracking-tight">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span>
      perturb <span class="text-zinc-500">·</span> <span class="text-zinc-400 font-normal">viewer</span>
    </div>
    <div class="mx-6 h-5 w-px bg-ink-700"></div>
    <select id="run-picker" class="bg-ink-800 text-zinc-100 text-sm border border-ink-700 rounded-md px-2 py-1 focus:outline-none focus:border-emerald-500"></select>
    <div class="ml-auto flex items-center gap-4 text-xs text-zinc-400">
      <span id="record-count">— records</span>
      <span class="flex items-center gap-1.5">
        <span id="live-dot" class="inline-block w-2 h-2 rounded-full bg-zinc-600"></span>
        <span id="live-text">connecting…</span>
      </span>
    </div>
  </header>

  <!-- Main -->
  <main class="flex h-[calc(100vh-3rem)]">
    <!-- Left: record list -->
    <aside class="w-80 border-r border-ink-700 flex flex-col bg-ink-900/40">
      <div class="p-3 border-b border-ink-700">
        <input id="record-search" type="text" placeholder="search question or core_id…"
               class="w-full bg-ink-800 border border-ink-700 rounded-md px-2.5 py-1.5 text-sm focus:outline-none focus:border-emerald-500 placeholder:text-zinc-500" />
      </div>
      <div id="record-list" class="flex-1 overflow-y-auto">
        <div class="p-8 text-center text-sm text-zinc-500">no run selected</div>
      </div>
    </aside>

    <!-- Right: detail -->
    <section class="flex-1 flex flex-col min-w-0">
      <!-- Tabs -->
      <div id="tabs" class="h-11 flex items-end px-4 border-b border-ink-700 bg-ink-900/30 gap-1">
        <!-- tabs injected by JS -->
      </div>
      <div id="detail" class="flex-1 overflow-y-auto p-6">
        <div class="text-zinc-500 text-sm">select a record on the left</div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
