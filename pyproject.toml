[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perturb"
version = "0.1.0"
description = "GaRAGe perturbation pipeline for memory-conflict RAG and judge-pairing research."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "datasets>=2.18",
    "rich>=13.7",
    "orjson>=3.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "watchfiles>=0.21",
]

[project.scripts]
perturb = "perturb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/perturb"]
